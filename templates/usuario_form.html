{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h4>👤 {{ acao }}</h4>
    <a href="/usuarios" class="btn btn-outline-secondary">
        Voltar
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">

                {% if erro %}
                <div class="alert alert-danger">
                    {{ erro }}
                </div>
                {% endif %}

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Usuário</label>
                        <input type="text"
                               class="form-control"
                               name="username"
                               value="{{ username or '' }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Senha {% if uid %}(deixe em branco para manter a atual){% endif %}
                        </label>

                        <input type="password"
                               class="form-control"
                               name="password"
                               {% if not uid %}required{% endif %}>

                        <div class="form-text">
                            Mínimo 10 caracteres, contendo letra maiúscula,
                            número e caractere especial.
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="/usuarios" class="btn btn-secondary">
                            Cancelar
                        </a>

                        <button type="submit" class="btn btn-primary">
                            Salvar
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
