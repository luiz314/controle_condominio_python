<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Backup</title></head>
<body>
  <h2>Backup e Restore</h2>
  <a href="/dashboard">← Dashboard</a>
  <br><br>

  <h3>Backup Manual</h3>
  <a href="/backup/create"><button>Gerar Backup Agora</button></a>

  <br><br>
  <h3>Backup Agendado</h3>
  <form method="POST" action="/backup/agendar">
    <label>
      <input type="checkbox" name="ativo" {% if agendado and agendado[0] %}checked{% endif %}>
      Ativar backup automático
    </label><br><br>
    <label>Intervalo (horas):
      <input type="number" name="intervalo_horas" min="1" max="168"
             value="{{ agendado[1] if agendado else 24 }}">
    </label><br><br>
    <button type="submit">Salvar Agendamento</button>
  </form>

  <br>
  <h3>Backups Disponíveis</h3>
  {% if backups %}
    <table border="1" cellpadding="6">
      <tr><th>Arquivo</th><th>Download</th></tr>
      {% for f in backups %}
      <tr>
        <td>{{ f }}</td>
        <td><a href="/backup/download/{{ f }}">⬇ Baixar</a></td>
      </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>Nenhum backup encontrado.</p>
  {% endif %}

  <br>
  <h3>Restaurar Backup</h3>
  <form method="POST" action="/backup/restore" enctype="multipart/form-data"
        onsubmit="return confirm('Isso irá apagar todos os dados atuais. Confirmar?')">
    <input type="file" name="file" accept=".sql" required>
    <button type="submit">Restaurar</button>
  </form>
</body>
</html>
