{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h4>💾 Backup e Restore</h4>
    <a href="/dashboard" class="btn btn-outline-secondary">Voltar</a>
</div>

<div class="row g-4">

    <div class="col-md-4">
        <div class="card shadow-sm h-100">
            <div class="card-body text-center">
                <h5>Backup Manual</h5>
                <p class="text-muted">Gerar backup imediato do sistema.</p>
                <a href="/backup/create" class="btn btn-success">Gerar Backup</a>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <h5>Backup Automático</h5>

                <form method="POST" action="/backup/agendar">

                    <div class="form-check mb-3">
                        <input class="form-check-input"
                               type="checkbox"
                               name="ativo"
                               {% if agendado and agendado[0] %}checked{% endif %}>
                        <label class="form-check-label">
                            Ativar backup automático
                        </label>
                    </div>

                    <label class="form-label">Intervalo (horas)</label>

                    <input type="number"
                           class="form-control"
                           name="intervalo_horas"
                           min="1"
                           max="168"
                           value="{{ agendado[1] if agendado else 24 }}">

                    <button class="btn btn-primary mt-3 w-100">
                        Salvar
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <h5>Restaurar Backup</h5>

                <form method="POST"
                      action="/backup/restore"
                      enctype="multipart/form-data"
                      onsubmit="return confirm('Isso irá apagar todos os dados atuais. Confirmar?')">

                    <input type="file"
                           class="form-control mb-3"
                           name="file"
                           accept=".sql"
                           required>

                    <button class="btn btn-danger w-100">
                        Restaurar
                    </button>
                </form>
            </div>
        </div>
    </div>

</div>

<div class="card shadow-sm mt-4">
    <div class="card-header">
        Backups Disponíveis
    </div>

    <div class="card-body">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Arquivo</th>
                    <th width="120">Download</th>
                </tr>
            </thead>

            <tbody>
                {% for f in backups %}
                <tr>
                    <td>{{ f }}</td>
                    <td>
                        <a href="/backup/download/{{ f }}"
                           class="btn btn-outline-primary btn-sm">
                            Baixar
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
