{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h4>📋 Pessoas</h4>
    <a href="/dashboard" class="btn btn-outline-secondary">
        Voltar
    </a>
</div>

<div class="card shadow-sm mb-4">
    <div class="card-body">
        <form method="GET">
            <div class="input-group">
                <input name="busca"
                       value="{{busca}}"
                       class="form-control"
                       placeholder="Buscar nome">
                <button class="btn btn-primary">Buscar</button>
            </div>
        </form>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body p-0">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
                <tr>
                    <th>Nome</th>
                    <th>Documento</th>
                    <th>Status</th>
                    <th width="180">Ação</th>
                </tr>
            </thead>
            <tbody>
                {% for p in pessoas %}
                <tr>
                    <td>{{p[1]}}</td>
                    <td>{{p[2]}}</td>

                    <td>
                        {% if p[3] %}
                            <span class="text-success">● Dentro</span>
                        {% else %}
                            <span class="text-secondary">● Fora</span>
                        {% endif %}
                    </td>

                    <td>
                        {% if p[3] %}
                            <a href="/saida/{{p[0]}}" class="btn btn-danger btn-sm">
                                Registrar Saída
                            </a>
                        {% else %}
                            <a href="/entrada/{{p[0]}}" class="btn btn-success btn-sm">
                                Registrar Entrada
                            </a>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
